name: Nightly deploy

on:
  schedule:
    # 10:00 UTC daily — after all NBA games (including West Coast) have
    # finished, so the pipeline pulls a fully-settled previous night.
    - cron: "0 10 * * *"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.15"

      - uses: pnpm/action-setup@v4
        with:
          version: "12.4.2"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: |
            web/pnpm-lock.yaml
            worker/pnpm-lock.yaml

      - name: Install pipeline deps
        working-directory: pipeline
        run: uv sync --dev

      - name: Fetch latest data
        working-directory: pipeline
        run: PYTHONPATH=src uv run python -m hub.fetch.backfill

      - name: Build canonical tables
        working-directory: pipeline
        run: PYTHONPATH=src uv run python -m hub.tables.pipeline

      - name: Fetch style-map tracking data
        working-directory: pipeline
        run: PYTHONPATH=src uv run python -m hub.style.fetch_data

      - name: Export web data (ask, style, shots, game flow)
        working-directory: pipeline
        run: |
          PYTHONPATH=src uv run python -m hub.ask.export
          PYTHONPATH=src uv run python -m hub.ask.examples
          PYTHONPATH=src uv run python -m hub.style.pipeline
          PYTHONPATH=src uv run python -m hub.style.export
          PYTHONPATH=src uv run python -m hub.shots.export
          PYTHONPATH=src uv run python -m hub.gameflow.export

      - name: Install web deps
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build static site
        working-directory: web
        run: pnpm build

      - name: Install worker deps
        working-directory: worker
        run: pnpm install --frozen-lockfile

      - name: Deploy to Cloudflare Workers
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run deploy
